<title>Smart Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Smart Diary · concept demo styles */
:root {
  --red: #d8232a;
  --red-dark: #b51c22;
  --red-50: #fdf1f1;
  --red-100: #f8d9da;
  --red-200: #efb3b5;
  --ink: #23262b;
  --ink-2: #474c55;
  --muted: #6c727c;
  --faint: #9aa0a8;
  --line: #d7dbe0;
  --line-2: #e7eaed;
  --bg: #e9eef1;
  --soft: #f4f6f8;
  --white: #ffffff;
  --char: #2e313a;
  --char-2: #3c414b;
  --green: #1d7f47;
  --amber: #b26a00;
  --shadow: 0 1px 2px rgba(20, 24, 31, 0.06), 0 6px 22px rgba(20, 24, 31, 0.08);
  --font: 'Open Sans', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
html { font-size: 14px; }
@media (min-width: 1600px) { html { font-size: 15px; } }
@media (min-width: 1880px) { html { font-size: 16.5px; } }
@media (max-height: 760px) and (max-width: 1599px) { html { font-size: 13px; } }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--white); color: var(--ink); font-family: var(--font);
  line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--red); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
#app { min-height: 100vh; display: flex; flex-direction: column; }
main.view { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  border: 1.5px solid var(--red); background: var(--red); color: #fff; font-weight: 700;
  font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 0.55rem 0.95rem; border-radius: 2px; white-space: nowrap; transition: background 0.15s, box-shadow 0.15s;
}
.btn:hover { background: var(--red-dark); border-color: var(--red-dark); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.outline { background: #fff; color: var(--red); }
.btn.outline:hover { background: var(--red-50); }
.btn.dark { background: var(--char); border-color: var(--char); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn.ghost:hover { background: var(--soft); }
.btn.white { background: #fff; color: var(--red); border-color: #fff; }
.btn.on-red { background: transparent; border-color: #fff; color: #fff; }
.btn.on-red:hover { background: rgba(255, 255, 255, 0.12); }
.btn.sm { font-size: 0.7rem; padding: 0.38rem 0.7rem; }
.btn.xs { font-size: 0.64rem; padding: 0.26rem 0.5rem; }
.btn.done { background: var(--char); border-color: var(--char); color: #fff; }
.pulse { animation: pulse 0.45s ease-out; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(216, 35, 42, 0.55); } 100% { box-shadow: 0 0 0 10px rgba(216, 35, 42, 0); } }

/* ---------- Top navigation (home, records, pilot) ---------- */
.topnav {
  display: flex; align-items: center; gap: 2.5rem; padding: 0.9rem 4.5vw; background: #fff;
  border-bottom: 1px solid var(--line-2); position: sticky; top: 0; z-index: 20;
}
.logo { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; color: var(--red); cursor: pointer; }
.logo b { font-style: italic; font-weight: 800; font-size: 1.45rem; letter-spacing: -0.02em; }
.logo small { color: var(--ink); font-weight: 700; font-size: 0.6rem; letter-spacing: 0.12em; margin-top: 2px; }
.logo:hover { text-decoration: none; }
.topnav nav { display: flex; gap: 2.2rem; }
.topnav nav a { color: var(--ink); font-size: 0.95rem; letter-spacing: 0.02em; }
.topnav nav a.on, .topnav nav a:hover { color: var(--red); text-decoration: none; }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: 1.85fr 1fr; min-height: 22rem; }
.hero-dark {
  position: relative; overflow: hidden; color: #fff; padding: 3.2rem 4.5vw 4.5rem;
  background: linear-gradient(105deg, #2a3038 0%, #3d434d 45%, #5d6772 100%);
}
.hero-dark .waves { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.16; }
.hero-dark .pulse-line { position: absolute; left: 0; right: 0; bottom: 1.6rem; width: 100%; height: 4.2rem; }
.kicker { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.hero h1 { font-size: 2.65rem; line-height: 1.12; margin: 0.9rem 0 0; font-weight: 800; max-width: 34rem; position: relative; }
.hero .lead { position: relative; max-width: 36rem; margin-top: 1rem; color: #e7e9ec; font-size: 1.05rem; }
.hero-red { background: var(--red); color: #fff; padding: 3.4rem 3vw 2rem; display: flex; flex-direction: column; justify-content: center; gap: 0.6rem; }
.hero-red label { font-weight: 700; font-size: 0.9rem; }
.hero-red input, .hero-red select { width: 100%; border: 0; padding: 0.65rem 0.75rem; border-radius: 1px; color: var(--ink); background: #fff; margin-bottom: 0.5rem; }
.hero-red .checks { display: grid; gap: 0.45rem; margin: 0.4rem 0 0.8rem; }
.hero-red .checks div { background: #fff; color: var(--ink); padding: 0.55rem 0.7rem; font-size: 0.86rem; display: flex; gap: 0.55rem; align-items: center; }
.tick { display: inline-grid; place-items: center; width: 1rem; height: 1rem; background: var(--red); color: #fff; font-size: 0.7rem; border-radius: 1px; flex: none; }
.tick.dark { background: var(--char); }

.wrap { padding: 2.4rem 4.5vw 3rem; }
.wrap h2.red { color: var(--red); font-size: 1.9rem; margin: 0 0 0.4rem; font-weight: 800; }
.wrap p.intro { font-size: 1.08rem; color: var(--ink-2); max-width: 56rem; margin: 0 0 1.8rem; }
.tagline { color: var(--red); font-size: 1.85rem; font-weight: 800; line-height: 1.25; margin: 0 0 0.5rem; }

.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.4rem; align-items: start; }
.fcard { border: 1px solid var(--line); padding: 1.1rem 1.2rem; background: #fff; }
.fcard h4 { margin: 0.5rem 0 0.3rem; font-size: 1.02rem; }
.fcard p { margin: 0; color: var(--ink-2); font-size: 0.9rem; }
.badge { display: inline-block; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.06em; padding: 0.15rem 0.45rem; text-transform: uppercase; border-radius: 1px; }
.badge.red { background: var(--red); color: #fff; }
.badge.outline { border: 1px solid var(--red); color: var(--red); background: #fff; }
.badge.dark { background: var(--char); color: #fff; }
.badge.grey { background: var(--line-2); color: var(--ink-2); }
.badge.green { background: #e3f3ea; color: var(--green); }
.section-title { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin: 2rem 0 0.7rem; display: flex; gap: 0.6rem; align-items: center; }
.section-title::before { content: ''; width: 1.6rem; height: 3px; background: var(--red); }

table.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tbl th { text-align: left; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0.5rem 0.6rem; border-bottom: 2px solid var(--ink); }
.tbl td { padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--red-50); }
.status { font-size: 0.72rem; font-weight: 700; }

/* ---------- Workspace ---------- */
.work { flex: 1; display: flex; flex-direction: column; min-height: 0; height: calc(100vh - 2.3rem); }
.stephead { display: flex; align-items: flex-start; gap: 2rem; padding: 0.95rem 2.3vw 0.85rem; background: #fff; border-bottom: 1px solid var(--line-2); }
.stephead .label { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.12em; display: flex; gap: 0.6rem; align-items: center; color: var(--ink); }
.stephead .label::before { content: ''; width: 1.6rem; height: 3px; background: var(--red); }
.stephead h1 { color: var(--red); font-size: 1.95rem; font-weight: 800; margin: 0.15rem 0 0; line-height: 1.15; letter-spacing: -0.01em; }
.stepper { display: flex; gap: 1.15rem; margin-top: 0.2rem; white-space: nowrap; }
.stepper button { border: 0; background: none; padding: 0.15rem 0 0.25rem; font-size: 0.8rem; color: var(--faint); letter-spacing: 0.04em; border-bottom: 2px solid transparent; }
.stepper button b { font-weight: 800; margin-right: 0.25rem; }
.stepper button.on { color: var(--red); border-bottom-color: var(--red); }
.stepper button:hover { color: var(--red); }
.home-link { color: var(--red); font-weight: 800; font-style: italic; font-size: 1rem; margin-right: -0.6rem; }

.workbg { flex: 1; min-height: 0; background: var(--bg); padding: 0.75rem 2.3vw 0.75rem; display: flex; }
.card { flex: 1; min-height: 0; background: #fff; box-shadow: var(--shadow); display: flex; flex-direction: column; max-width: 1600px; margin: 0 auto; width: 100%; }
.card-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem 0.6rem; position: relative; }
.card-head::after { content: ''; position: absolute; left: 1rem; right: 1rem; bottom: 0; height: 2px; background: var(--red); }
.card-head h2 { margin: 0; color: var(--red); font-size: 1.22rem; font-weight: 700; }
.card-head .ver { color: var(--muted); font-size: 0.72rem; margin-left: 0.4rem; }
.card-info { display: flex; justify-content: space-between; padding: 0.4rem 1rem; background: var(--soft); color: var(--ink-2); font-size: 0.76rem; margin-top: 0.1rem; }
.card-main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.form-grid { position: absolute; inset: 0; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1.7rem; padding: 0.9rem 1rem 1.2rem; align-content: start; }
.col { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
.field label, .flabel { display: block; font-weight: 700; font-size: 0.82rem; margin-bottom: 0.3rem; }
.field label .req, .flabel .req { color: var(--red); margin-right: 0.15rem; }
.field label .hint { font-weight: 400; color: var(--muted); }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid #c9ced4; background: #fff; padding: 0.5rem 0.65rem; border-radius: 1px; font-size: 0.88rem;
}
.field textarea { min-height: 4.2rem; resize: vertical; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--red-200); border-color: var(--red); }
.field input[readonly] { background: #fff; }
.row { display: flex; gap: 0.5rem; align-items: stretch; }
.row > .grow { min-width: 0; }
.err { color: var(--red); font-size: 0.78rem; margin-top: 0.25rem; }
.stars { display: flex; gap: 0.25rem; }
.stars button { border: 0; background: none; font-size: 1.5rem; line-height: 1; color: var(--red); padding: 0 0.05rem; }
.attach { display: flex; gap: 0.6rem; align-items: center; font-size: 0.82rem; }
.file-chip { border: 1px solid var(--line); padding: 0.32rem 0.6rem; display: inline-flex; gap: 0.4rem; align-items: center; background: #fff; }
.file-chip i { width: 0.65rem; height: 0.8rem; border: 1.5px solid var(--red); border-radius: 1px; display: inline-block; }
.redbar { background: var(--red); color: #fff; font-weight: 700; padding: 0.55rem 0.8rem; font-size: 0.86rem; }
.trip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.trip .field input { background: #fff; }
.small { font-size: 0.76rem; color: var(--muted); }
.contact { display: flex; align-items: center; gap: 0.5rem; }
.initials { display: inline-grid; place-items: center; width: 1.45rem; height: 1.45rem; background: var(--char); color: #fff; font-size: 0.6rem; font-weight: 700; flex: none; }

/* Tags strip: the only new element in the form */
.tags-strip { border: 1.5px solid var(--red-200); background: var(--red-50); padding: 0.7rem 0.75rem 0.8rem; }
.tags-strip.confirmed { border-color: var(--red-200); }
.tags-top { display: flex; align-items: center; gap: 0.5rem; }
.tags-top h5 { margin: 0; font-size: 0.8rem; color: var(--red); letter-spacing: 0.04em; font-weight: 800; text-transform: uppercase; }
.tags-sub { font-size: 0.76rem; color: var(--ink-2); margin: 0.3rem 0 0.6rem; }
.tags-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.45rem 0.55rem; }
.tag { min-width: 0; display: flex; align-items: center; gap: 0.5rem; background: #fff; border: 1px solid #c9ced4; padding: 0.3rem 0.4rem 0.3rem 0.55rem; min-height: 2.2rem; }
.tag .tk { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); width: 5.2rem; flex: none; text-transform: uppercase; }
.tag select { border: 0; background: transparent; font-size: 0.84rem; flex: 1; min-width: 0; padding: 0.1rem 0; appearance: none; -webkit-appearance: none; cursor: pointer; text-overflow: ellipsis; }
.tag select:focus { outline: none; }
.tag .from { font-size: 0.6rem; color: var(--faint); white-space: nowrap; }
.box { width: 1.15rem; height: 1.15rem; flex: none; border: 1.5px solid var(--red); background: #fff; display: inline-grid; place-items: center; color: #fff; font-size: 0.72rem; cursor: pointer; padding: 0; }
.box.on { background: var(--red); }
.box.dark.on { background: var(--char); border-color: var(--char); }
.tags-foot { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.7rem; font-size: 0.76rem; color: var(--ink-2); }
.spin { display: inline-block; width: 0.85rem; height: 0.85rem; border: 2px solid var(--red-200); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.cited-box { border: 1px solid var(--line); padding: 0.65rem 0.75rem; background: var(--soft); }
.cited-box h6 { margin: 0 0 0.4rem; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }
.cited-box li { font-size: 0.8rem; margin-bottom: 0.2rem; }
.cited-box ul { margin: 0; padding-left: 1rem; }

/* ---------- Smart Diary panel ---------- */
.sdpanel {
  position: absolute; top: 0; right: 0; bottom: 0; width: calc(50% + 0.35rem); background: #fff; z-index: 5;
  display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(20, 24, 31, 0.16);
  transform: translateX(104%); transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.sdpanel.open { transform: none; }
.sd-open-tab {
  position: absolute; right: 0; top: 1.2rem; z-index: 4; writing-mode: vertical-rl; transform: rotate(180deg);
  background: var(--red); color: #fff; border: 0; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.08em; padding: 0.9rem 0.42rem;
}
.sd-head { background: var(--red); color: #fff; padding: 0.85rem 1rem 0.8rem; display: grid; grid-template-columns: 1fr auto; gap: 0.15rem 1rem; align-items: center; position: relative; }
.sd-logo { display: flex; align-items: center; gap: 0.55rem; font-weight: 800; font-size: 1.32rem; }
.sd-logo svg { width: 1.45rem; height: 1.1rem; }
.sd-sub { grid-column: 1; font-size: 0.78rem; opacity: 0.95; }
.sd-tabs { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 0.45rem; align-items: center; }
.sd-tabs button { border: 1.5px solid #fff; background: transparent; color: #fff; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.06em; padding: 0.42rem 1.05rem; }
.sd-tabs button.on { background: #fff; color: var(--red); }
.sd-tabs .sd-close { border: 0; background: transparent; color: #fff; font-size: 1.4rem; line-height: 1; padding: 0 0 0 0.35rem; opacity: 0.85; }
.sd-body { flex: 1; overflow: auto; padding: 0.8rem 0.9rem 1rem; }
.sd-empty { text-align: center; padding: 2.4rem 1.5rem; color: var(--ink-2); }
.sd-empty p { margin: 0 0 1rem; }

/* Pipeline */
.pipe-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0.2rem 0.2rem 0.6rem; border-bottom: 1px solid var(--line-2); margin-bottom: 0.5rem; }
.pipe-head b { font-size: 0.98rem; }
.timer { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pstep { border: 1px solid var(--line-2); margin-bottom: 0.45rem; background: #fff; transition: opacity 0.3s; }
.pstep.pending { opacity: 0.4; }
.pstep-row { display: grid; grid-template-columns: 1.6rem 1fr 1.15fr; gap: 0.7rem; align-items: center; padding: 0.55rem 0.65rem; cursor: pointer; }
.pstep-row .ck { width: 1.3rem; height: 1.3rem; border: 1.5px solid var(--char); display: grid; place-items: center; font-size: 0.75rem; color: #fff; }
.pstep.done .ck { background: var(--char); }
.pstep-row b { font-size: 0.88rem; display: block; }
.pstep-row small { font-size: 0.72rem; color: var(--muted); }
.pres { background: var(--soft); padding: 0.45rem 0.6rem; font-size: 0.8rem; min-height: 2.1rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
.pres .hot { color: var(--red); font-weight: 800; }
.pres s { color: var(--muted); }
.minibars { display: inline-flex; align-items: flex-end; gap: 2px; height: 1.2rem; position: relative; margin-left: 0.3rem; }
.minibars i { width: 0.42rem; background: var(--red); display: block; }
.minibars i.weak { background: #c6cbd1; }
.minibars .fl { position: absolute; left: -2px; right: -2px; border-top: 1.5px dashed var(--ink); }
.pdetail { border-top: 1px dashed var(--line); padding: 0.6rem 0.75rem 0.75rem; font-size: 0.8rem; }
.pdetail .chiplist { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.scorebar { height: 0.55rem; background: var(--line-2); position: relative; min-width: 6rem; }
.scorebar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); }
.scorebar span.weak { background: #b9bec5; }
.scorebar .floor { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--ink); }
.writer-line { font-size: 0.72rem; color: var(--muted); margin-top: 0.6rem; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.live { background: #20a35a; box-shadow: 0 0 0 3px rgba(32, 163, 90, 0.18); }

/* Reference brief */
.ref { border: 1px solid var(--line); padding: 0.65rem 0.75rem 0.6rem; margin-bottom: 0.55rem; background: #fff; transition: opacity 0.3s; }
.ref.used { border-color: var(--red-200); box-shadow: inset 3px 0 0 var(--red); }
.ref.notrel { opacity: 0.45; }
.ref-top { display: flex; align-items: center; gap: 0.5rem; }
.num { display: inline-grid; place-items: center; min-width: 1.25rem; height: 1.25rem; background: var(--char); color: #fff; font-size: 0.72rem; font-weight: 800; flex: none; padding: 0 0.2rem; }
.ref-top h4 { margin: 0; font-size: 0.95rem; font-weight: 700; }
.yr { font-size: 0.72rem; color: var(--muted); }
.bar { height: 0.42rem; background: var(--line-2); margin: 0.55rem 0 0.15rem; position: relative; max-width: 14rem; display: inline-block; width: 40%; vertical-align: middle; }
.bar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); }
.bar.none { background: repeating-linear-gradient(90deg, #c9ced4 0 4px, transparent 4px 7px); height: 2px; }
.fig { display: inline-block; font-size: 0.78rem; color: var(--red); font-weight: 700; margin-left: 0.7rem; vertical-align: middle; }
.fig.none { color: var(--ink-2); }
.lesson { margin: 0.3rem 0 0.45rem; font-size: 0.86rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.32rem; align-items: center; }
.chip { border: 1px solid var(--line); background: #fff; font-size: 0.63rem; font-weight: 700; letter-spacing: 0.05em; padding: 0.2rem 0.45rem; color: var(--ink-2); display: inline-flex; gap: 0.3rem; align-items: center; }
.chip:hover { border-color: var(--red); color: var(--red); }
.chip i { width: 0.55rem; height: 0.65rem; border: 1.3px solid currentColor; border-radius: 1px; display: inline-block; }
.chip.de::after { content: 'DE'; font-size: 0.55rem; background: var(--line-2); padding: 0 0.2rem; }
.refchip { display: inline-block; background: var(--char); color: #fff; font-size: 0.58rem; font-weight: 800; padding: 0.05rem 0.3rem; margin-left: 0.3rem; letter-spacing: 0.04em; vertical-align: 1px; }
.brief-foot { display: grid; grid-template-columns: 1.35fr 1fr; gap: 0; border: 1px solid var(--line); margin-top: 0.2rem; }
.brief-foot > div { padding: 0.6rem 0.75rem; }
.brief-foot h5 { margin: 0 0 0.35rem; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--red); text-transform: uppercase; font-weight: 800; }
.brief-foot ol { margin: 0; padding-left: 1.1rem; font-size: 0.8rem; }
.brief-foot li { margin-bottom: 0.2rem; }
.nf { background: var(--red-50); border-left: 3px solid var(--red); font-size: 0.8rem; }
.nf h5 { color: var(--red) !important; }

  /* ================================================================== */

  var TECH_CUES = [

  E.suggestTags = function (form) {

    var t = ' ' + norm(text) + ' ';
    var titleT = ' ' + norm(form.title || '') + ' ';
    var spot = form.spot || {};
    var out = {};
    var tech = detectTech(form.title || '') || detectTech(text);
    out.technology = { value: tech || '', from: tech ? (detectTech(form.title || '') ? 'title' : 'description') : 'choose' };
    var d = TECH_DEFAULTS[tech] || {};
    if (tech === 'heat recovery') {
      var src = firstCue(t, SOURCES), sink = firstCue(t, SINKS);
      var u = src && sink ? src + ' → ' + sink : '';
      if (u && SD.VOCAB.utility.indexOf(u) < 0) {

  /* Prompt for Claude to pick the six tags (structured output, constrained to

  /* query: {projectId, title, description, tags:{6 values}, spot:{co2,capex,area}} */
  E.retrieveBrief = function (idx, query) {
    var t0 = Date.now();
    var tags = query.tags || {};
    var qText = [query.title, query.description].join('. ');
    var qTerms = tokens(qText);
    var qCon = concepts(qText);
    var pool = idx.projects.filter(function (r) { return r.id !== query.projectId; });

    // 2 · filter by tags
    var cand = pool.filter(function (r) { return r.tags.technology === tags.technology || r.tags.utility === tags.utility; });
    var widened = false;
    if (cand.length < 3) {

      cand = pool.filter(function (r) { return tagScore(tags, r.tags) >= 0.35; });
    }
    var candSet = {};
    cand.forEach(function (r) { candSet[r.id] = 1; });

    idx.passages.forEach(function (p) {

    });
    scored.sort(function (a, b) { return b.h.score - a.h.score; });
    var best = {};
    scored.forEach(function (s) { if (!best[s.p.pid] || best[s.p.pid].h.score < s.h.score) best[s.p.pid] = s; });
    var retrieved = Object.keys(best).sort(function (a, b) { return best[b].h.score - best[a].h.score; });

      var r = idx.proj[pid];

      var txt = Math.min(1, best[pid].h.score / 0.45);
      var score = 0.55 * ts + 0.45 * txt;
      return { pid: pid, title: r.title, year: r.year, tag: round(ts), text: round(txt), score: round(score), shown: score >= E.PARAMS.floor };
    }).sort(function (a, b) { return b.score - a.score; });
    var shown = topK.filter(function (x) { return x.shown; });

    // Evidence for each reference: every passage of the project, best first

      var r = idx.proj[x.pid];
      var ps = idx.passages.filter(function (p) { return p.pid === x.pid; }).map(function (p) {
        return { p: p, s: hybrid(idx, qTerms, qCon, p).score };
      }).sort(function (a, b) { return (b.p.kind === 'spot') - (a.p.kind === 'spot') || b.s - a.s; });
      return { rank: i + 1, pid: x.pid, score: x.score, passages: ps.map(function (o) { return o.p.id; }) };
    });

    var notFound = null;
    var sameUtil = pool.filter(function (r) { return tags.utility && r.tags.utility === tags.utility; });
    var closedSame = sameUtil.filter(function (r) { return r.achieved != null; });
    var est = query.spot && query.spot.co2 ? query.spot.co2 + ' t' : 'the estimate';

    } else if (!closedSame.length) {
      var open = sameUtil.filter(function (r) { return r.achieved == null; })[0];

          : (tags.technology === 'heat recovery'
            ? 'No reference combines this heat source with this sink. Treat ' + est + ' as unverified.'
            : 'No reference matches this utility exactly. Treat ' + est + ' as unverified.')
      };

      projectId: query.projectId,
      query: { title: query.title, tags: tags, spot: query.spot || {}, terms: qTerms.slice(0, 40), concepts: Object.keys(qCon) },
      steps: {
        filter: { total: pool.length, candidates: cand.map(function (r) { return r.id; }), widened: widened },
        search: { matched: scored.length, top: scored.slice(0, 12).map(function (s) { return { id: s.p.id, pid: s.p.pid, label: s.p.label, score: round(s.h.score), lex: round(s.h.lex), sem: round(s.h.sem) }; }) },
        rerank: { k: E.PARAMS.rerankK, floor: E.PARAMS.floor, scored: topK }

      notFound: notFound,

          s.blocks.forEach(function (bl, k) { var l = tokens(bl).filter(function (w) { return tokens(A.question).indexOf(w) >= 0; }).length; if (l > best) { best = l; b = k; } });
        }
        var r = idx.proj[s.pid];
        var sent = s.blocks[b];
        c.push({ text: 'In ' + r.id + ' (' + r.title + ', ' + r.year + ')' + (s.lang === 'de' ? ', German record' : '') + ': ' + sent + ' ', citations: [cite(S, i, b)] });

  };

  E.assembleAsk = function (A, resp) {

    if (A.notFound || /^NOT FOUND\b/.test(raw)) {

    }
    var chk = check(resp.content);
    if (!chk.kept.length) return { notFound: true, sentences: [], sources: [], deleted: chk.deleted, usedSpot: false };
    var order = [], map = {};
    var sents = chk.kept.map(function (s) {
      var nums = [];
      s.cites.forEach(function (c) {
        var src = A.sources[c.search_result_index];

        var n = map[src.id] + 1;

      });
      return { text: s.text, cites: nums };
    });
    var sources = order.map(function (o, i) {
      return { n: i + 1, id: o.src.id, pid: o.src.pid, chip: o.src.chip, label: o.src.label, kind: o.src.kind, cited: o.cited, rows: o.src.rows || null, title: o.src.title };

    return { notFound: false, sentences: sents, sources: sources, deleted: chk.deleted, usedSpot: sources.some(function (s) { return s.kind === 'query'; }) };

  /* ================================================================== */
  /* Write: diary entry 1, drafted from what is already written          */
  /* ================================================================== */
  function fmtDate(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  E.fmtDate = fmtDate;

  /* input: {projectId, title, description, meeting, co2, unverified, decision:{option, conditions:[{short,long,ref,pid}]},
             refsUsed:[{pid, lesson}], tags:[...] } */
  E.draftSources = function (input) {
    var form = {
      id: 'form', pid: input.projectId, kind: 'form', chip: 'SSC APP FORM', label: 'SSC App form · ' + input.projectId, lang: 'en',
      title: 'SSC Project Presentation · ' + input.projectId,

    };
    var d = input.decision || {};
    var optText = d.option === 'conditions' ? 'Go to deepening with ' + num((d.conditions || []).length) + ' conditions.' : d.option === 'hold' ? 'Hold and rework.' : 'Go to deepening as proposed.';
    var dec = {
      id: 'decision', pid: input.projectId, kind: 'decision', chip: 'REVIEW 1 OUTCOME', label: 'SSC Review 1 outcome · ' + fmtDate(input.meeting), lang: 'en',
      title: 'SSC Review 1 decision, ' + fmtDate(input.meeting),

  E.prompts.draft = function (input) {

      'then "References used:" with each project ID and its lesson in a few words in brackets; ' +

  E.offline.draft = function (input, prompt) {

      c.push({ text: head + 'hold and rework. ', citations: [cite(S, 1, 0)] });
    } else {
      c.push({ text: head + 'go to deepening as proposed. ', citations: [cite(S, 1, 0)] });
    }

      c.push({ text: 'References used: ' + input.refsUsed.map(function (r) { return r.pid + ' (' + (r.short || r.lesson).replace(/\.$/, '').toLowerCase() + ')'; }).join(', ') + '. ', citations: input.refsUsed.map(function (r, i) { return cite(S, 2, i); }) });
    }
    if (input.unverified) {
      c.push({ text: 'The ' + input.co2 + ' t CO₂e per year is a PM estimate and stays unverified until measured.', citations: [cite(S, 0, 2), cite(S, 3, 0)] });
    }

  };

  E.assembleDraft = function (input, prompt, resp) {
    var chk = check(resp.content);
    var text = chk.kept.map(function (s) { return s.text; }).join(' ');
    var used = {};
    chk.kept.forEach(function (s) { s.cites.forEach(function (c) { var src = prompt.sources[c.search_result_index]; if (src) used[src.chip] = 1; }); });

  /* ================================================================== */
  /* Writers without native citations (Claude inside a claude.ai page)   */
  /* ================================================================== */
  /* The same retrieved passages, numbered [S1] [S2] …; Claude ends every
     sentence or line with the markers it relied on. The markers become
     citations, so the citation check below works exactly as with the API's
     search_result citations: a sentence without a marker is deleted. */
  E.markerPrompt = function (prompt) {
    var src = prompt.sources.map(function (s, i) {
      return '[S' + (i + 1) + '] ' + s.label + ' · ' + s.title + (s.lang === 'de' ? ' (German original)' : '') + '\n' + s.blocks.join(' ');
    }).join('\n\n');
    return prompt.system + '\n\nSOURCES\n' + src + '\n\nTASK\n' + prompt.user +
      '\n\nCITATIONS: end every sentence or line with the marker of each source it relies on, for example [S2] or [S2][S5]. ' +
      'Use only the markers listed under SOURCES. A sentence or line without a marker is deleted. Plain text, no Markdown.';
  };
  function overlapBlock(src, text) {
    var want = {};
    tokens(text).forEach(function (w) { want[w] = 1; });
    var best = 0, bestN = -1;

    });
    return best;
  }

    var MARK = /\[S\d+\](?:\s*\[S\d+\])*/;

    var t = String(text || '').replace(/((?:[ \t]*\[S\d+\])+)[ \t]*([.,;:!?])/g, '$2$1');
    var parts = t.split(/(\[S\d+\](?:[ \t]*\[S\d+\])*)/);
    var out = [];
    parts.forEach(function (part) {
      if (!part) return;
      if (MARK.test(part) && /^\[S/.test(part)) {
        var prev = out[out.length - 1];
        if (!prev) return;
        // The marker belongs to the last sentence or line before it only.
        var spans = sentenceSpans(' ' + prev.text);
        if (spans.length > 1) {
          var cut = spans[spans.length - 1][0] - 1;
          var head = prev.text.slice(0, cut), tail = prev.text.slice(cut);
          prev.text = head;
          prev = { text: tail, citations: [] };
          out.push(prev);
        }
        (part.match(/\d+/g) || []).forEach(function (d) {
          var i = Number(d) - 1;
          var s = sources[i];
          if (!s) return;
          var b = overlapBlock(s, prev.text);
          if (!prev.citations.some(function (c) { return c.search_result_index === i; })) {
            prev.citations.push({ search_result_index: i, start_block_index: b, end_block_index: b + 1, cited_text: s.blocks[b] || '' });
          }
        });
        return;
      }
      out.push({ text: part, citations: [] });
    });
    return out;
  };
  /* Tags as one JSON object, for writers without structured output. */
  E.tagPromptText = function (form) {
    var p = E.tagPrompt(form);
    return p.system + '\n\n' + p.user +
      '\n\nReply with only a JSON object with the keys technology, utility, scope, area, equipment and capex, each exactly one value from its list below, ' +
      'and reasons: an object with the keys technology, utility and equipment, each at most 12 words.\n' +
      SD.TAG_TYPES.map(function (t) { return t.key + ': ' + SD.VOCAB[t.key].join(' | '); }).join('\n');
  };

  /* ================================================================== */
  /* Orchestration: retrieve → write (Claude or offline) → check         */
  /* ================================================================== */
  function runWriter(write, prompt, offline) {
    var t0 = Date.now();
    if (!write) return Promise.resolve({ resp: offline(), writer: { mode: 'offline', model: 'offline extractive writer', ms: Date.now() - t0 } });
    return Promise.resolve()
      .then(function () { return write(prompt); })
      .then(function (resp) {
        return { resp: resp, writer: { mode: 'claude', model: resp.model, ms: Date.now() - t0, usage: resp.usage || null } };
      })
      .catch(function (err) {
        return { resp: offline(), writer: { mode: 'offline', model: 'offline extractive writer', ms: Date.now() - t0, fallback: String((err && err.message) || err) } };
      });
  }

  E.rag = {};
  E.rag.brief = function (idx, query, write) {
    var R = E.retrieveBrief(idx, query);
    var prompt = E.prompts.brief(idx, R);
    if (!R.refs.length) {
      return Promise.resolve({ R: R, brief: E.assembleBrief(idx, R, prompt, { content: [] }), writer: { mode: 'none', ms: 0 } });
    }
    return runWriter(write, prompt, function () { return E.offline.brief(idx, R, prompt); }).then(function (o) {
      return { R: R, brief: E.assembleBrief(idx, R, prompt, o.resp), writer: o.writer };
    });
  };
  E.rag.ask = function (idx, question, ctx, write) {
    var A = E.retrieveAsk(idx, question, ctx);
    var prompt = E.prompts.ask(A);
    if (A.notFound) return Promise.resolve({ A: A, answer: E.assembleAsk(A, { content: [] }), writer: { mode: 'none', ms: 0 } });
    return runWriter(write, prompt, function () { return E.offline.ask(idx, A); }).then(function (o) {
      return { A: A, answer: E.assembleAsk(A, o.resp), writer: o.writer };
    });
  };
  E.rag.draft = function (input, write) {
    var prompt = E.prompts.draft(input);
    return runWriter(write, prompt, function () { return E.offline.draft(input, prompt); }).then(function (o) {
      return { draft: E.assembleDraft(input, prompt, o.resp), writer: o.writer };
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*

(function () {

  let IDX = null, IDXKEY = '';

  const CACHE = {};

  const viaServer = () => RAG.mode === 'claude';

  }

    clearTimeout(toastT);

  }
  const tagValues = (t) => { const o = {}; Object.keys(t || {}).forEach((k) => (o[k] = t[k].value)); return o; };
  const fmtDate = E.fmtDate;
  const dayName = (iso) => (iso ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(iso + 'T12:00:00').getDay()] + ' ' + fmtDate(iso) : '');
  const nowStr = () => { const d = new Date(); return d.toLocaleDateString('de-AT') + ' ' + d.toTimeString().slice(0, 5); };

      </div>
      <div class="sd-body">${tab === 'ask' ? askBody(p) : tab === 'write' ? writeBody(p) : compareBody(p)}</div>
      ${tab === 'ask' ? `<form class="askbar" data-form="ask"><input id="ask-q" placeholder="Ask about previous projects …" autocomplete="off"><button class="btn" type="submit" ${UI.askBusy ? 'disabled' : ''}>Ask</button></form>` : ''}
    </aside>`;
  }

  function compareBody(p) {
    if (!p.tagsConfirmed) {
      return `<div class="sd-empty"><p>Compare starts from the six confirmed tags.</p><p class="small">Fill in the SPOT ID, run the SPOT lookup and confirm the tags in the form.</p></div>`;
    }
    if (UI.live || (UI.showPipe && p.compare)) return pipelineView(p);
    if (!p.compare) {
      return `<div class="sd-empty"><p>Compare this project with ${index().projects.length} indexed past projects.</p><button class="btn" data-act="run-compare">Find comparable projects</button></div>`;
    }
    return briefView(p);
  }

  function pipelineView(p) {
    const live = UI.live;
    const R = live ? live.R : p.compare.R;
    const res = live ? live.res : p.compare;
    const step = live ? live.step : 6;
    const elapsed = live ? (Date.now() - live.t0) / 1000 : (p.compare.ms || 0) / 1000;
    const idx = index();
    const q = R.query;
    const sc = R.steps.rerank.scored;
    const shown = sc.filter((x) => x.shown).length;
    const del = res ? res.brief.deleted.length : 0;
    const rows = [
      ['Build the query', 'Form fields, confirmed tags, SPOT figures', `${esc(q.tags.technology)} · ${esc(String(q.tags.utility).replace(' heating', ''))} · ${esc(q.tags.capex)}`],
      ['Filter by tags', 'Same technology class or utility', `<span class="hot">${R.steps.filter.total}</span> indexed projects → <span class="hot">${R.steps.filter.candidates.length}</span> candidates${R.steps.filter.widened ? ' (widened)' : ''}`],
      ['Hybrid search', 'Keyword (BM25) + semantic, over cards, decks, decisions, diary', `<span class="hot">${R.steps.filter.candidates.length}</span> projects → <span class="hot">${R.steps.search.matched}</span> matching passages`],
      ['Re-rank, apply floor', 'Weak matches below the floor are dropped', `${sc.length} scored → <span class="hot">${shown} shown</span>, ${sc.length - shown} too weak <span class="minibars">${sc.map((x) => `<i class="${x.shown ? '' : 'weak'}" style="height:${Math.round(x.score * 100)}%"></i>`).join('')}<span class="fl" style="bottom:${Math.round(R.steps.rerank.floor * 100)}%"></span></span>`],
      ['Write the brief', 'Only from those passages, one source per sentence', res ? (del ? `<s>${del} sentence${del > 1 ? 's' : ''} without a source</s> → deleted` : 'Citation check: every line has a source') + ` · ${res.writer.mode === 'claude' ? 'Claude' : res.writer.mode === 'none' ? 'nothing to write' : 'offline writer'}` : step >= 4 ? `<span class="spin"></span> ${liveWriter() ? 'Claude is writing from the retrieved passages…' : 'Writing…'}` : ''],
      ['Log', 'What was shown, to whom and when', 'Audit trail kept with the SSC record']
    ];
    const details = [
      () => `<div><b>Terms:</b> ${q.terms.map(esc).join(', ')}</div><div style="margin-top:.3rem"><b>Concepts:</b> ${q.concepts.map(esc).join(', ')}</div><div style="margin-top:.3rem"><b>Tags:</b> ${SD.TAG_TYPES.map((t) => esc(q.tags[t.key])).join(' · ')} · <b>SPOT:</b> ${esc(q.spot.co2 || '?')} t CO₂e, ${esc(q.spot.capex || '?')}</div>`,
      () => `<div class="chiplist">${R.steps.filter.candidates.map((id) => `<button class="chip" data-act="record" data-pid="${id}" title="${esc(idx.proj[id] ? idx.proj[id].title : '')}">${id}</button>`).join('')}</div>`,
      () => `<table class="tbl"><thead><tr><th>Passage</th><th>Keyword</th><th>Semantic</th><th>Score</th></tr></thead><tbody>${R.steps.search.top.map((x) => `<tr class="click" data-act="source" data-id="${esc(x.id)}"><td>${esc(x.label)}</td><td class="mono">${x.lex.toFixed(2)}</td><td class="mono">${x.sem.toFixed(2)}</td><td class="mono"><b>${x.score.toFixed(2)}</b></td></tr>`).join('')}</tbody></table><div class="small" style="margin-top:.3rem">Top 12 of ${R.steps.search.matched}. Score = ½ keyword + ½ semantic. German and English share one concept vocabulary.</div>`,
      () => `<table class="tbl"><thead><tr><th>Project</th><th>Tags</th><th>Text</th><th style="width:40%">Score vs floor ${R.steps.rerank.floor.toFixed(2)}</th></tr></thead><tbody>${sc.map((x) => `<tr><td><b>${x.pid}</b><div class="small">${esc(x.title)}</div></td><td class="mono">${x.tag.toFixed(2)}</td><td class="mono">${x.text.toFixed(2)}</td><td><div class="scorebar"><span class="${x.shown ? '' : 'weak'}" style="width:${x.score * 100}%"></span><i class="floor" style="left:${R.steps.rerank.floor * 100}%"></i></div><div class="small">${x.score.toFixed(2)} · ${x.shown ? 'shown' : 'too weak, dropped'}</div></td></tr>`).join('')}</tbody></table><div class="small" style="margin-top:.3rem">Re-rank = 0.55 × tag match + 0.45 × text match. Tags before semantics.</div>`,
      () => res ? `<div>${writerText(res.writer)}</div>${res.brief.deleted.length ? `<div class="deleted">Deleted: ${res.brief.deleted.map((d) => `<s>${esc(d)}</s>`).join(' · ')}</div>` : '<div class="deleted">No sentence was deleted: every line of the brief cites a retrieved passage.</div>'}` : '',
      () => `<div>${esc(S.log[0] ? S.log[0].at + ' · ' + S.log[0].who + ' · ' + S.log[0].action + ' · ' + S.log[0].detail : 'Logged when the brief is shown.')}</div><a data-act="nav" data-to="log">Open the audit log ›</a>`
    ];
    return `<div class="pipe-head"><b>Comparing with past Takeda projects</b><span class="timer" id="timer">${elapsed.toFixed(1)} s</span></div>
      ${rows.map((r, i) => {
        const n = i + 1;
        const state = step >= n ? 'done' : step >= n - 1 ? 'active' : 'pending';
        const open = !live && UI.expanded[n];
        return `<div class="pstep ${state}"><div class="pstep-row" data-act="expand" data-step="${n}"><span class="ck">${state === 'done' ? '✓' : ''}</span><div><b>${r[0]}</b><small>${r[1]}</small></div><div class="pres">${state === 'pending' ? '' : r[2]}</div></div>${open ? `<div class="pdetail">${details[i]()}</div>` : ''}</div>`;
      }).join('')}
      ${!live ? `<div style="display:flex;gap:.5rem;margin-top:.4rem"><button class="btn sm" data-act="toggle-pipe">Show the reference brief ›</button><span class="small" style="align-self:center">Click a step to see what it did.</span></div>` : ''}`;
  }

  function figHTML(r) {
    if (r.achieved != null) {
      return `<span class="bar"><span style="width:${Math.min(100, r.pct)}%"></span></span><span class="fig">Promised ${r.promised} t · achieved ${r.achieved} t (${r.pct} %)</span>`;
    }
    return `<span class="bar none"></span><span class="fig none">${r.status === 'closed' ? 'Achieved: not recorded' : 'Achieved: not yet (' + esc(r.status) + ')'}</span>`;
  }
  function chipBtn(c, hl) {
    const p = index().byId[c.id];
    return `<button class="chip ${p && p.lang === 'de' ? 'de' : ''}" data-act="source" data-id="${esc(c.id)}" data-hl="${esc(hl || '')}"><i></i>${esc(c.chip)}</button>`;
  }
  function briefView(p) {
    const b = p.compare.brief;
    const lessonCite = (ref, id) => { const s = ref.lesson && ref.lesson.sources.find((x) => x.id === id); return s ? s.cited : ''; };
    const refsHTML = b.refs.map((r) => {
      const used = p.used.includes(r.pid), nr = p.notRelevant.includes(r.pid);
      return `<article class="ref ${used ? 'used' : ''} ${nr ? 'notrel' : ''}" id="ref-${r.rank}">
        <div class="ref-top"><span class="num">${r.rank}</span><h4>${esc(r.title)}</h4><span class="yr">${r.year}</span><span class="grow"></span>
          <button class="btn xs ${used ? 'done' : 'outline'}" data-act="use-ref" data-pid="${r.pid}" id="use-${r.rank}">${used ? '✓ Reference' : 'Use as reference'}</button>
          <button class="btn xs ghost" data-act="notrel" data-pid="${r.pid}">${nr ? 'Undo' : 'Not relevant'}</button></div>
        <div>${figHTML(r)}</div>
        <p class="lesson">${r.lesson ? esc(r.lesson.text) : '<span class="muted">No lesson could be cited for this reference.</span>'}</p>
        <div class="chips">${r.chips.map((c) => chipBtn(c, lessonCite(r, c.id))).join('')}<span class="grow"></span>${r.owner ? `<a class="small" data-act="contact" data-pid="${r.pid}">Ask: ${esc(r.owner.dept)}</a>` : ''}</div>
        ${nr ? '<div class="small" style="margin-top:.3rem">Marked not relevant. The rating feeds the Gate B quality check.</div>' : ''}
      </article>`;
    }).join('');
    const w = p.compare.writer;
    return `${b.refs.length ? refsHTML : ''}
      <div class="brief-foot">
        <div><h5>Questions to settle before Review 2</h5>${b.questions.length ? `<ol>${b.questions.map((q) => `<li>${esc(q.text)}<span class="refchip">REF ${q.ref}</span></li>`).join('')}</ol>` : '<span class="small">No question could be cited.</span>'}</div>
        <div class="nf">${b.notFound ? `<h5>Not found</h5>${esc(b.notFound.text).replace(/(\d+ t)/, '<b>$1</b>')}` : '<h5>Closest precedent</h5>A completed project with the same heat source and sink exists. Compare its figures before Review 2.'}</div>
      </div>
      <div class="writer-line"><span class="dot ${w.mode === 'claude' ? 'live' : ''}"></span>${writerText(w)} · ${b.deleted.length} sentence${b.deleted.length === 1 ? '' : 's'} without a source deleted · <a data-act="toggle-pipe">How these ${b.refs.length} were found</a></div>`;
  }

  /* ---------- Ask ---------- */
  function askContext(p) {
    const t = tagValues(p.tags);
    return [t.technology, t.utility, t.area].filter(Boolean).join(' · ');
  }
  function askBody(p) {
    const ctx = askContext(p);
    let html = `<div class="ctx"><span class="badge grey">Context</span>${esc(ctx || 'whole archive')}</div>`;
    if (!p.asks.length) {
      html += `<p class="small">Ask in plain language, in English or German. Smart Diary answers only from Takeda’s records; counts come from SPOT queries; if nothing passes the similarity floor it says “not found”.</p>
        <div class="suggest">${SD.ASK_SUGGESTIONS.map((q) => `<button data-act="ask-suggest" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
    }
    p.asks.forEach((a) => {
      html += `<div class="msg-user"><small>L. HOFER · PM</small><div class="bubble">${esc(a.q)}</div></div>`;
      if (a.pending) { html += `<div class="msg-ans"><span class="spin"></span> Searching Takeda records${liveWriter() ? ' · Claude is writing from the retrieved passages' : ''}…</div>`; return; }
      const ans = a.answer;
      if (ans.notFound) {
        html += `<div class="notfound-card"><b>NOT FOUND</b><div>No Takeda record answers this question. Nothing passed the similarity floor, so Smart Diary does not guess. Ask the owners of comparable projects, or rephrase.</div><div class="writer-line">${writerText(a.writer)}</div></div>`;
        return;
      }
      html += `<div class="msg-ans"><span class="lbl">Smart Diary · answered from Takeda records only</span>
        <p>${ans.sentences.map((s) => esc(s.text) + s.cites.map((n) => `<span class="cn" title="source ${n}">${n}</span>`).join('')).join(' ')}</p>
        <ul class="srcs">${ans.sources.map((s) => `<li><span class="num">${s.n}</span>${s.kind === 'query' ? `<button class="chip" data-act="query-src" data-ask="${p.asks.indexOf(a)}" data-n="${s.n}"><i></i>SPOT QUERY</button>` : `<button class="chip">${esc('SPOT ' + String(s.pid).toUpperCase())}</button>${s.kind !== 'spot' ? chipBtn(s, s.cited) : ''}`}<span class="snip">${esc(s.cited)}</span></li>`).join('')}</ul>
        ${ans.usedSpot ? `<div class="dbnote">${DB} Counts come from SPOT fields; the model only phrases them.</div>` : ''}
        <div class="writer-line"><span class="dot ${a.writer.mode === 'claude' ? 'live' : ''}"></span>${writerText(a.writer)}${ans.deleted.length ? ` · deleted without a source: ${ans.deleted.map((d) => `<s>${esc(d)}</s>`).join(' · ')}` : ''}</div>
      </div>`;
    });
    return html;
  }

  /* ---------- Write ---------- */
  function entryHTML(text) {
    return esc(text).replace(/^(Decision \([^)]*\):)/, '<b>$1</b>').replace(/(References used:)/, '<b>$1</b>');
  }
  function writeBody(p) {
    const e = p.entry;
    const gates = [['After Review 1', '5 min'], ['At Review 2', '10 min'], ['At go-live', '10 min'], ['Closeout · Step 6', '10 min']];
    let html = `<div class="gates">${gates.map((g, i) => `<div class="gate ${i === 0 && e && e.status === 'confirmed' ? 'on' : ''}" title="${['Decision, conditions, references used · drafted from the SSC App and the meeting outcome', 'Chosen option, rejected options and why · drafted from the approval deck', 'Surprises in implementation and qualification · drafted from handover notes', 'Promised vs achieved, advice to the next project · drafted from SPOT and the sustainability dashboard'][i]}"><span class="gk">${i === 0 && e && e.status === 'confirmed' ? '✓' : i + 1}</span><b>${g[0].toUpperCase()}</b><small>${g[1]}</small></div>`).join('')}</div>`;
    if (!p.decision) {
      return html + `<div class="sd-empty"><p>Diary entry 1 is drafted after the SSC decision at Review 1.</p><button class="btn" data-act="open-decision">Record the Review 1 decision</button></div>`;
    }
    if (UI.drafting) return html + `<div class="entry"><span class="spin"></span> Drafting entry 1 from the SSC App form, the Review 1 outcome and the references used${liveWriter() ? ' · Claude' : ''}…</div>`;
    if (!e) return html + `<div class="sd-empty"><p>Draft entry 1 from what is already written.</p><button class="btn" data-act="draft">Draft diary entry 1</button></div>`;
    const tags = tagValues(p.tags);
    const typing = UI.typing && UI.typing.pid === p.id;
    const indexed = S.indexed.some((r) => r.id === p.id);
    return html + `<div class="entry">
      <div class="entry-top"><h5>DIARY ENTRY 1 · AFTER SSC REVIEW 1</h5><span class="grow"></span>
        ${e.status === 'confirmed' ? `<span class="badge dark">✓ Confirmed by PM · ${indexed ? 'indexed, searchable' : 'indexed tonight'}</span>` : '<span class="badge outline">Draft · not published</span>'}</div>
      ${UI.editing ? `<textarea id="entry-edit">${esc(e.text)}</textarea>` : `<p class="entry-text ${typing ? 'caret' : ''}" id="entry-text">${typing ? esc(e.text.slice(0, UI.typing.n)) : entryHTML(e.text)}</p>`}
      <div class="tagchips">${SD.TAG_TYPES.map((t) => `<span>${esc(tags[t.key])}</span>`).join('')}</div>
      <div class="entry-meta"><span>Drafted from: ${esc((e.draftedFrom || []).map((x) => x.toLowerCase()).join(' · ') || 'SSC App form · Review 1 outcome · references used')}</span><span><b>${e.words}</b> / 150 words</span></div>
      ${e.deleted && e.deleted.length ? `<div class="deleted">Deleted without a source: ${e.deleted.map((d) => `<s>${esc(d)}</s>`).join(' · ')}</div>` : ''}
      <div class="writer-line"><span class="dot ${e.writer && e.writer.mode === 'claude' ? 'live' : ''}"></span>${writerText(e.writer)}${e.edited ? ' · edited by the PM' : ''}</div>
      <div class="entry-actions">
        ${e.status === 'confirmed'
          ? `<button class="btn outline sm" data-act="go-loop">Step 6 feeds Step 1 ›</button>`
          : UI.editing ? `<button class="btn ghost sm" data-act="cancel-edit">Cancel</button><button class="btn sm" data-act="save-edit">Save text</button>`
            : `<button class="btn ghost sm" data-act="edit-entry">Edit</button><button class="btn" id="btn-confirm-entry" data-act="confirm-entry">Confirm entry</button>`}
      </div>
    </div>`;
  }

  /* ================================================================ */
  /* Overlays: decision, source drawer, record, info                   */
  /* ================================================================ */
  function overlay() {
    if (UI.drawer) return drawerHTML();
    if (UI.modal === 'decision') return decisionHTML();
    if (UI.modal === 'ssc') return infoModal('SSC information', 'Sustainability Steering Committee', `<p>The SSC meets every Thursday at 14:35. Each project gets up to 20 minutes.</p><p><b>Review 1 · Planning:</b> sustainability potentials are identified. <b>Review 2 · Investment approval:</b> the business case is approved.</p><p>With Smart Diary, the pre-read of Review 1 contains the reference brief: the same page for the PM and for every SSC member. The SSC keeps full decision authority; Smart Diary changes what is on the table.</p>`);
    if (UI.modal === 'contact') return contactHTML();
    if (UI.modal === 'rag') return ragInfo();
    return '';
  }
  function infoModal(title, sub, body) {
    return `<div class="scrim" data-act="close-overlay"><div class="modal narrow" data-stop="1"><div class="m-head"><h3>${esc(title)}</h3><p>${esc(sub)}</p><button class="m-close" data-act="close-overlay">×</button></div><div class="m-body">${body}</div></div></div>`;
  }
  function contactHTML() {
    const r = index().proj[UI.contact];
    if (!r || !r.owner) return '';
    return infoModal(r.owner.name, r.owner.role, `<p>Owner of <b>${esc(r.id)}</b> · ${esc(r.title)} (${r.year}).</p><p>Smart Diary names the person who knows why an option was rejected and what went wrong: the knowledge that today sits only in people’s heads. Call before Review 2.</p><p class="small">Invented person for the demo.</p>`);
  }
  function ragInfo() {
    const m = RAG.mode;
    const sub = m === 'claude' ? `Live · Claude ${RAG.model} through the local server` : m === 'artifact' ? 'Live · Claude on your claude.ai account' : 'Offline writer · no language model connected';
    const gen = m === 'claude'
      ? `The retrieved passages go to <b>Claude (${esc(RAG.model)})</b> as search-result blocks with citations on. Claude writes only from them.`
      : m === 'artifact'
        ? 'The retrieved passages go to <b>Claude</b>, on the account of whoever views this page, numbered [S1], [S2] … Claude must end every sentence with the numbers of its sources; those become the citations.'
        : 'No model is connected here, so an extractive writer composes the text from the retrieved passages.';
    return infoModal('How the RAG works in this demo', sub, `
      <p><b>1–4 · Retrieve</b> runs for real on ${index().projects.length} invented projects and ${index().N} passages: tag filter, hybrid search (BM25 keyword + bilingual concept vectors), re-rank, similarity floor. Counts and totals are queries on SPOT fields.</p>
      <p><b>5 · Generate.</b> ${gen} Then the citation check runs: <b>a sentence without a source is deleted</b>. If nothing passes the floor, the answer is “not found”. If Claude is unavailable, the offline writer answers and the screen says so.</p>
      <p><b>6 · Log.</b> Every brief, answer, decision and entry goes to the audit log.</p>
      ${m === 'artifact' ? `<p><b>Claude speed:</b> <button class="btn sm ${tier() === 'quick' ? '' : 'ghost'}" data-act="tier" data-v="quick">Quick (live pitch)</button> <button class="btn sm ${tier() === 'default' ? '' : 'ghost'}" data-act="tier" data-v="default">Balanced (better text, slower)</button></p>
        <p>The first call asks you to allow this page to use Claude. Allow it once before the pitch: <button class="btn outline sm" data-act="warm-claude">Allow Claude now</button> <span class="small" id="warm-msg">${esc(UI.warm || '')}</span></p>` : ''}
      ${m === 'offline' ? `<p class="small">To let Claude write: open the published link of this page in claude.ai, or run the local server with an API key (<span class="kbd">npm install</span>, <span class="kbd">ANTHROPIC_API_KEY=…</span> in <span class="kbd">.env</span>, <span class="kbd">npm start</span>, then http://localhost:3000).</p>` : ''}`);
  }
  function decisionHTML() {
    const p = proj();
    const b = p.compare && p.compare.brief;
    const D = UI.dec || { option: null, checked: {}, custom: [] };
    const conds = (b ? b.conditions : []).concat(D.custom.map((c) => ({ short: c, long: c, ref: null, custom: true })));
    const lastAsk = p.asks.filter((a) => a.answer && !a.answer.notFound).slice(-1)[0];
    const meet = p.form.meeting || SD.MEETINGS[1];
    const opt = (v, label) => `<div class="radio ${D.option === v ? 'on' : ''}" data-act="dec-opt" data-v="${v}" id="opt-${v}"><i></i>${label}</div>`;
    return `<div class="scrim" data-act="close-overlay"><div class="modal" data-stop="1">
      <div class="m-head"><h3>SSC Review 1 · Decision</h3><p>${dayName(meet)} · 14:35 · ${esc(p.form.minutes || 20)} min · ${esc(p.form.title)}</p><button class="m-close" data-act="close-overlay">×</button></div>
      <div class="m-body m-cols">
        <div>
          <h6 class="cap">Decision</h6>
          ${opt('proposed', 'Go to deepening as proposed')}${opt('conditions', 'Go to deepening <b>with conditions</b>')}${opt('hold', 'Hold and rework')}
          <h6 class="cap" style="margin-top:1rem">Conditions · suggested from the Smart Diary brief</h6>
          ${conds.length ? conds.map((c, i) => `<div class="cond" data-act="dec-cond" data-i="${i}" id="cond-${i}"><span class="box ${D.checked[i] ? 'on' : ''}">${D.checked[i] ? '✓' : ''}</span><span class="grow">${esc(c.short)}</span>${c.ref ? `<span class="refchip">REF ${c.ref}</span>` : '<span class="badge grey">added</span>'}</div>`).join('') : '<div class="small">No conditions in the brief.</div>'}
          <form class="addcond" data-form="addcond"><input id="addcond" placeholder="Add a condition…"><button class="btn ghost sm" type="submit">Add</button></form>
          <div style="margin-top:1.2rem"><button class="btn" id="btn-save-dec" data-act="dec-save" ${D.option ? '' : 'disabled'}>Save decision</button></div>
        </div>
        <div>
          <h6 class="cap">In the pre-read · Smart Diary brief</h6>
          ${b ? b.refs.map((r) => `<div class="mini-ref"><b>${r.rank} · ${esc(r.title)} · ${r.year}</b><small>${r.pct != null ? 'Achieved ' + r.pct + ' %' : 'Achieved not recorded'} · ${esc(r.lesson ? r.lesson.text : '')}</small></div>`).join('') : ''}
          ${b && b.notFound ? `<div class="mini-ref nf"><b>Not found</b><small>${esc(b.notFound.text)}</small></div>` : ''}
          <h6 class="cap" style="margin-top:.9rem">Asked in the meeting</h6>
          <div class="mini-ref">${lastAsk ? `<small>${esc(lastAsk.q)}</small><b>${esc(lastAsk.answer.sentences.map((s) => s.text).join(' ').slice(0, 220))}</b>` : '<small>Nothing asked yet.</small>'}</div>
          <p class="small">The SSC keeps full decision authority. Smart Diary changes what is on the table.</p>
        </div>
      </div></div></div>`;
  }
  function highlight(text, hl) {
    const sents = E.sentences(text);
    const H = String(hl || '');
    return sents.map((s) => {
      const on = (H && (H.indexOf(s) >= 0 || s.indexOf(H) >= 0)) || (!H && /^Assumption/.test(s));
      return on ? `<mark>${esc(s)}</mark>` : esc(s);
    }).join(' ');
  }
  function drawerHTML() {
    const d = UI.drawer;
    const idx = index();
    let head = '', body = '', footBtns = '';
    if (d.type === 'record') {
      const r = idx.proj[d.pid];
      if (!r) return '';
      const ps = idx.passages.filter((x) => x.pid === r.id);

  /* ================================================================ */
  /* Flows                                                             */
  /* ================================================================ */
  function setForm(p, np) {
    Object.assign(p.form, { spotId: np.spotId, title: np.title, description: np.description, contact: np.contact, meeting: np.meeting, minutes: String(np.minutes), stars: np.stars, attachments: [np.attachment] });
  }
  function doLookup(p) {
    const id = String(p.form.spotId || '').trim();
    const np = Object.values(SD.NEW_PROJECTS).find((x) => x.spotId === id);
    if (!np) {
      UI.lookupErr = id ? `No SPOT record for “${id}”. Demo IDs: ${Object.keys(SD.NEW_PROJECTS).join(', ')}.` : 'Enter a SPOT ID first.';
      return false;
    }
    UI.lookupErr = '';
    p.spot = Object.assign({}, np.spot);
    return true;
  }
  async function fillForm(p, a) {
    const np = SD.NEW_PROJECTS[p.id] || SD.NEW_PROJECTS[DEMO];
    if (!a) { setForm(p, np); doLookup(p); render(); return; }
    await sleep(500);
    await typeInto('#f-spot', np.spotId, 12);
    await sleep(250); flash('#btn-lookup'); await sleep(300);
    doLookup(p); render();
    await sleep(600); await typeInto('#f-title', np.title, 48);
    await sleep(250); await typeInto('#f-desc', np.description, 120);
    await sleep(300); p.form.contact = np.contact; render();
    await sleep(350); p.form.meeting = np.meeting; render();
    await sleep(250); await typeInto('#f-min', String(np.minutes), 8);
    for (let n = 1; n <= np.stars; n++) { await sleep(220); p.form.stars = n; render(); }
    await sleep(300); p.form.attachments = [np.attachment]; render();
    save();
  }
  async function suggestTags(p, a) {
    const form = { title: p.form.title, description: p.form.description, spot: p.spot || {} };
    const mark = (t) => { const o = {}; Object.keys(t).forEach((k) => (o[k] = Object.assign({}, t[k], { checked: false }))); return o; };
    p.tagsConfirmed = false;
    p.tags = mark(E.suggestTags(form));
    p.tagsFrom = { mode: 'offline', model: 'rule-based tagger' };
    UI.tagBusy = liveWriter();
    refresh('tags'); refresh('stephead');
    const res = await genTags(form);
    UI.tagBusy = false;
    p.tags = mark(res.tags);
    p.tagsFrom = res.writer;
    refresh('tags');
    for (const t of SD.TAG_TYPES) {
      if (a) await sleep(280);
      if (p.tags[t.key].value) p.tags[t.key].checked = true;
      if (a) refresh('tags');
    }
    refresh('tags');
    save();
  }
  async function confirmTags(p, a) {
    if (a) { await sleep(500); flash('#btn-confirm-tags'); await sleep(350); }
    SD.TAG_TYPES.forEach((t) => { if (p.tags[t.key]) p.tags[t.key].checked = true; });
    p.tagsConfirmed = true;
    addLog('Tags confirmed', SD.TAG_TYPES.map((t) => p.tags[t.key].value).join(' · '));
    refresh('tags'); refresh('stephead');
  }
  function queryOf(p) {
    return { projectId: p.id, title: p.form.title, description: p.form.description, tags: tagValues(p.tags), spot: p.spot ? { co2: p.spot.co2, capex: p.spot.capex, area: p.spot.area } : {} };
  }
  let timerI = null;
  function openPanel(p, tab) {
    const wasOpen = p.panel.open;
    p.panel.open = true;
    p.panel.tab = tab || p.panel.tab;
    if (!wasOpen) UI.openPanelNext = true;
  }
  async function runCompare(p, a, keepPipe) {
    if (!p.tagsConfirmed) { toast('Confirm the six tags first.'); return; }
    const q = queryOf(p);
    openPanel(p, 'compare');
    p.compare = null; p.used = []; p.notRelevant = [];
    const R = E.retrieveBrief(index(), q);
    const gen = genBrief(q);
    UI.live = { step: 0, R, t0: Date.now(), res: null };
    UI.expanded = {};
    render();
    clearInterval(timerI);
    timerI = setInterval(() => { const t = $('#timer'); if (t && UI.live) t.textContent = ((Date.now() - UI.live.t0) / 1000).toFixed(1) + ' s'; }, 100);
    const D = a ? 950 : 0;
    await sleep(a ? 700 : 0);
    for (let s = 1; s <= 4; s++) { await sleep(D); UI.live.step = s; refresh('panel'); }
    const res = await gen;
    await sleep(a ? 500 : 0);
    UI.live.res = res; UI.live.step = 5; refresh('panel');
    await sleep(D * 0.7);
    UI.live.step = 6;
    addLog('Compare', `${res.brief.refs.length} references shown (${res.brief.refs.map((r) => r.pid).join(', ')}) · ${res.R.steps.search.matched} passages · writer: ${res.writer.mode === 'claude' ? res.writer.model : 'offline'}`, res.brief.refs.map((r) => r.pid));
    refresh('panel');
    await sleep(a ? 1300 : 0);
    clearInterval(timerI);
    const ms = Date.now() - UI.live.t0;
    p.compare = Object.assign({ at: Date.now(), ms }, res);
    UI.live = null; UI.showPipe = !!keepPipe;
    render(); save();
  }
  function useRef(p, pid) {
    const i = p.used.indexOf(pid);
    if (i >= 0) p.used.splice(i, 1);
    else {
      p.used.push(pid);
      p.notRelevant = p.notRelevant.filter((x) => x !== pid);
      addLog('Use as reference', pid + ' cited for the approval deck');
    }
    save();
  }
  async function sendAsk(p, q) {
    q = String(q || '').trim();
    if (!q || UI.askBusy) return;
    const item = { q, at: Date.now(), pending: true };
    p.asks.push(item);
    UI.askBusy = true;
    refresh('panel'); scrollAsk();
    const res = await genAsk(q, askContext(p));
    item.pending = false;
    item.answer = res.answer; item.writer = res.writer;
    UI.askBusy = false;
    addLog('Ask', `“${q}” → ${res.answer.notFound ? 'not found' : res.answer.sources.map((s) => s.chip + (s.pid ? ' ' + s.pid : '')).join(', ')}`);
    refresh('panel'); scrollAsk(); save();
  }
  function scrollAsk() { const b = $('.sd-body'); if (b) b.scrollTop = b.scrollHeight; }
  function openDecision(p) {
    if (!p.compare) { toast('Run Compare first: the decision uses the reference brief.'); return false; }
    const conds = p.compare.brief.conditions;
    if (p.decision) {
      const checked = {};
      p.decision.conditions.forEach((c) => { const i = conds.findIndex((x) => x.short === c.short); if (i >= 0) checked[i] = true; });
      const custom = p.decision.conditions.filter((c) => !c.ref).map((c) => c.short);
      custom.forEach((c, k) => { checked[conds.length + k] = true; });
      UI.dec = { option: p.decision.option, checked, custom };
    } else UI.dec = { option: null, checked: {}, custom: [] };
    UI.modal = 'decision';
    return true;
  }
  function saveDecision(p) {
    const D = UI.dec;
    const conds = p.compare.brief.conditions.concat(D.custom.map((c) => ({ short: c, long: c.replace(/\.?$/, '.'), ref: null, pid: null })));
    const chosen = D.option === 'conditions' ? conds.filter((c, i) => D.checked[i]).map((c) => ({ short: c.short, long: c.long, ref: c.ref, pid: c.pid })) : [];
    p.decision = { option: D.option, conditions: chosen, date: p.form.meeting, savedAt: Date.now() };
    p.entry = null;
    UI.modal = null; UI.dec = null;
    addLog('SSC decision', `Review 1 ${dayName(p.form.meeting)}: ${D.option === 'conditions' ? 'go with ' + chosen.length + ' conditions (' + chosen.map((c) => c.short).join('; ') + ')' : D.option}`);
    toast(`Decision saved · Review 1 · ${dayName(p.form.meeting)}`);
    save();
  }
  function draftInput(p) {
    const b = p.compare.brief;
    const idx = index();
    const used = (p.used.length ? p.used : []).map((pid) => {
      const ref = b.refs.find((r) => r.pid === pid);
      const rec = idx.proj[pid];
      const lesson = ref && ref.lesson ? ref.lesson.text : '';
      return { pid, lesson, short: rec && rec.shortLesson ? rec.shortLesson : lesson };
    });
    return {
      projectId: p.id, title: p.form.title, description: p.form.description, meeting: p.form.meeting || SD.MEETINGS[1],
      co2: p.spot ? p.spot.co2 : '?', unverified: !!b.notFound, decision: p.decision, refsUsed: used
    };
  }
  async function draftEntry(p, a) {
    if (!p.decision) { toast('Record the Review 1 decision first.'); return; }
    UI.drafting = true; UI.editing = false;
    refresh('panel');
    const res = await genDraft(draftInput(p));
    UI.drafting = false;

  async function runGateB() {
    const idx = index();
    const rows = [];
    let rel = 0, relN = 0, nf = 0, nfN = 0, bad = 0, cites = 0;
    for (const t of SD.GATE_B_TESTS) {
      const out = await E.rag.ask(idx, t.q, null, null);
      const ans = out.answer;
      ans.sources.forEach((s) => {
        cites++;
        const passage = s.kind === 'query' ? out.A.sources.find((x) => x.kind === 'query') : idx.byId[s.id];
        const text = passage ? (passage.blocks ? passage.blocks.join(' ') : passage.text) : '';
        if (!passage || (s.cited && text.indexOf(s.cited) < 0)) bad++;
      });
      if (t.expect === 'notfound') {
        nfN++; if (ans.notFound) nf++;
        rows.push({ q: t.q, expect: 'not found', got: ans.notFound ? 'not found' : ans.sources.map((s) => s.pid || 'SPOT query').join(', '), ok: ans.notFound });
      } else {
        relN++;
        const pids = new Set();
        ans.sources.forEach((s) => (s.rows || [s.pid]).forEach((x) => pids.add(x)));
        const ok = t.expect.some((e) => pids.has(e));
        if (ok) rel++;

      }

    UI.gateB = { rows, rel, relN, nf, nfN, bad, cites };

  }

  async function goScene(i, jump) {
    if (i < 0 || i >= SD.SCENES.length) return;
    const from = S.guided ? S.guided.scene : -1;
    S.guided = { scene: i };
    G.busy = true;
    const sc = SD.SCENES[i];
    UI.callout = null;
    try {
      if (jump || i !== from + 1) {
        anim.skip = true;
        if (i <= from || from < 0) resetDemo();
      }
      for (let k = 1; k < i; k++) if (!DONE[k]()) { const s = anim.skip; anim.skip = true; await RUN[k](false); anim.skip = s; }

  /* Start                                                             */
  /* ================================================================ */
  // A reload in the middle of a run leaves no animation half-done.
  Object.values(S.projects).forEach((p) => { p.asks = (p.asks || []).filter((a) => a.answer); });
  render();
  checkServer();
  window.SmartDiary = { state: () => S, ui: UI, goScene, next, prev, rag: RAG, busy: () => G.busy };
})();

</script>
